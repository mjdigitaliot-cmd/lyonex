services:
  postgres:
    image: postgres:16-alpine
    container_name: lyonex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lyonex
    ports:
      - "5432:5432"
    volumes:
      - lyonex_pgdata:/var/lib/postgresql/data

volumes:
  lyonex_pgdata:
